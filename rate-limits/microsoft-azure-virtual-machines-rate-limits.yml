description: Azure Virtual Machines API throttling is implemented by the Microsoft.Compute
  resource provider on top of Azure Resource Manager (ARM). Compute uses a token-bucket
  algorithm with two layers — per-resource and per-subscription — applied per region, with
  a 1-minute window. Each VM API category (Put, Update, Delete, Low-Cost-Get, High-Cost-Get,
  Get-Operation, Guest-Patch) has its own bucket sizes and refill rates. Throttled requests
  return HTTP 429 with the x-ms-ratelimit-remaining-resource header showing remaining tokens.
