policies:
  - name: Token bucket algorithm
    description: Each policy category has a refill rate and max bucket capacity. Tokens are
      consumed per request; depletion triggers throttling. The bucket refills at the documented
      rate every minute.
  - name: Resource and subscription stacking
    description: Both buckets must have tokens for a request to succeed. Resource limits prevent
      a single VM from exhausting subscription quota; subscription limits prevent a single
      subscription from impacting other tenants in the region.
  - name: Honor x-ms-ratelimit-remaining-resource
    description: This header is returned with every Compute response and shows remaining tokens
      across applicable policies. Use it to back off proactively before getting 429.
  - name: Exponential backoff with Retry-After
    description: SDKs auto-retry 429s with exponential backoff. Custom clients should honor
      Retry-After and add jitter.
  - name: Use batch / list operations
    description: Prefer single List call over per-VM Get loop. Use Get Async Operation polling
      sparingly — long-poll fewer ops.
  - name: ARM token-bucket layering
    description: In addition to Compute-specific limits, ARM-level subscription buckets (250
      reads/25 per sec; 200 writes/10 per sec) also apply.
